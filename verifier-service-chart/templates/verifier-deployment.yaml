apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier-service
  namespace: verifier-system
  labels:
    app: verifier-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: verifier-service
  template:
    metadata:
      labels:
        app: verifier-service
    spec:
      containers:
        - name: verifier
          image: verifier-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: RUST_LOG
              value: info